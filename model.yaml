    id: PVT_kwHOAC5Zr84Bp9ZZ
    name: Schedule
    number: 1
    public: false
    readme: |-
      A team's Schedule project holds its committed tasks and bugs.

      - The Schedule field names the schedule each row belongs to: one option per schedule, named for its Schedule issue, which holds the schedule's deliverable and exit criteria.
      - Step orders the rows within a schedule. A Schedule issue's own row has no step.
      - Iteration gives each row its sprint.
      - Status is Open, In progress or Closed. Worktree links a step to the branch its work is on.
    repositories: []
    short_description: David-Noble-at-work's copy of NobleFactor's Schedule template. A user account can't have templates, so a Schedule project is copied from this one.
    teams: []
    template: false
    views:
