    id: PVT_kwHOAC5Zr84BqCRR
    name: Triage
    number: 4
    public: false
    readme: |-
      A Triage project is a team's queue of issues waiting to be classified. See the issue data model, section 3: https://github.com/NobleFactor/noblefactor-engprod/blob/develop/docs/architecture/issue-data-model/3-collections.md

      - Each team has one Triage project, copied from this template. A user account has one too.
      - Any issue can be a row, of any type or none. The rows have no order and no step numbers: this is a queue, worked and emptied.
      - A row leaves the queue once its issue is fully classified, or closed with a reason.
      - Status is Open, In progress or Closed.
    repositories: []
    short_description: David-Noble-at-work's copy of NobleFactor's Triage template. A user account can't have templates, so a Triage project is copied from this one.
